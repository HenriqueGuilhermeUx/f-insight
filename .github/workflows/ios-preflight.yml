name: F-Insight exploratory iOS simulator preflight (unsigned)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Install existing web dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build web assets
        run: pnpm exec tsc -b && pnpm exec vite build
      - name: Install temporary Capacitor iOS tooling in CI
        run: pnpm add -D @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/ios@7.4.3
      - name: Generate candidate iOS project
        run: pnpm exec cap add ios
      - name: Install iOS CocoaPods
        working-directory: ios/App
        run: pod install
      - name: Compile unsigned candidate for iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/finsight-ios-derived" build 2>&1 | tee ios-build.log
      - name: Launch exploratory candidate on iPhone simulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/finsight-ios-derived/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          DEVICE_ID="$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{let d=Object.values(JSON.parse(s).devices).flat().find(x=>x.isAvailable&&x.name.startsWith("iPhone"));if(!d)process.exit(1);console.log(d.udid)})')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/f-insight-candidate-smoke.png"
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID"
          xcrun simctl shutdown "$DEVICE_ID" || true
      - name: Archive candidate screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-insight-candidate-launch
          path: ${{ runner.temp }}/f-insight-candidate-smoke.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finsight-ios-preflight-log
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive unsigned simulator .app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: finsight-ios-candidate
          path: ${{ runner.temp }}/finsight-ios-derived/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
