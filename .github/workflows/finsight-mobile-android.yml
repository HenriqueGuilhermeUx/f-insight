name: F-Insight Mobile Android Build

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "Which Android artifact to build"
        required: true
        default: "aab"
        type: choice
        options:
          - aab
          - apk
          - both

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: production
  EXPO_PUBLIC_API_URL: https://f-insight-api.onrender.com
  EXPO_PUBLIC_WEB_URL: https://f-insight.netlify.app

jobs:
  android-build:
    name: Build locally signed Android artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Validate Expo dependencies
        run: npx expo install --check || true

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Check signing secrets
        env:
          FINSIGHT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.FINSIGHT_UPLOAD_KEYSTORE_BASE64 }}
          FINSIGHT_UPLOAD_STORE_PASSWORD: ${{ secrets.FINSIGHT_UPLOAD_STORE_PASSWORD }}
          FINSIGHT_UPLOAD_KEY_ALIAS: ${{ secrets.FINSIGHT_UPLOAD_KEY_ALIAS }}
          FINSIGHT_UPLOAD_KEY_PASSWORD: ${{ secrets.FINSIGHT_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$FINSIGHT_UPLOAD_KEYSTORE_BASE64" || (echo "Missing FINSIGHT_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "$FINSIGHT_UPLOAD_STORE_PASSWORD" || (echo "Missing FINSIGHT_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "$FINSIGHT_UPLOAD_KEY_ALIAS" || (echo "Missing FINSIGHT_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "$FINSIGHT_UPLOAD_KEY_PASSWORD" || (echo "Missing FINSIGHT_UPLOAD_KEY_PASSWORD" && exit 1)

      - name: Configure release signing
        env:
          FINSIGHT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.FINSIGHT_UPLOAD_KEYSTORE_BASE64 }}
          FINSIGHT_UPLOAD_STORE_PASSWORD: ${{ secrets.FINSIGHT_UPLOAD_STORE_PASSWORD }}
          FINSIGHT_UPLOAD_KEY_ALIAS: ${{ secrets.FINSIGHT_UPLOAD_KEY_ALIAS }}
          FINSIGHT_UPLOAD_KEY_PASSWORD: ${{ secrets.FINSIGHT_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$FINSIGHT_UPLOAD_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/finsight-release-upload.keystore
          printf '\nFINSIGHT_UPLOAD_STORE_FILE=finsight-release-upload.keystore\n' >> android/gradle.properties
          printf 'FINSIGHT_UPLOAD_STORE_PASSWORD=%s\n' "$FINSIGHT_UPLOAD_STORE_PASSWORD" >> android/gradle.properties
          printf 'FINSIGHT_UPLOAD_KEY_ALIAS=%s\n' "$FINSIGHT_UPLOAD_KEY_ALIAS" >> android/gradle.properties
          printf 'FINSIGHT_UPLOAD_KEY_PASSWORD=%s\n' "$FINSIGHT_UPLOAD_KEY_PASSWORD" >> android/gradle.properties
          keytool -list -keystore android/app/finsight-release-upload.keystore -storepass "$FINSIGHT_UPLOAD_STORE_PASSWORD" -alias "$FINSIGHT_UPLOAD_KEY_ALIAS"
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          release_config = '''        releaseUpload {
              def uploadStoreFile = project.findProperty("FINSIGHT_UPLOAD_STORE_FILE")
              def uploadStorePassword = project.findProperty("FINSIGHT_UPLOAD_STORE_PASSWORD")
              def uploadKeyAlias = project.findProperty("FINSIGHT_UPLOAD_KEY_ALIAS")
              def uploadKeyPassword = project.findProperty("FINSIGHT_UPLOAD_KEY_PASSWORD")
              if (!uploadStoreFile || !uploadStorePassword || !uploadKeyAlias || !uploadKeyPassword) {
                  throw new GradleException("Missing F-Insight release signing properties")
              }
              storeFile file(uploadStoreFile)
              storePassword uploadStorePassword
              keyAlias uploadKeyAlias
              keyPassword uploadKeyPassword
          }
          '''
          if 'releaseUpload {' not in s:
              marker = '    signingConfigs {\n'
              if marker not in s:
                  raise SystemExit('Could not find signingConfigs block in android/app/build.gradle')
              s = s.replace(marker, marker + release_config, 1)
          s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.releaseUpload')
          p.write_text(s)
          PY

      - name: Build signed APK
        if: ${{ github.event.inputs.artifact == 'apk' || github.event.inputs.artifact == 'both' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Build signed AAB
        if: ${{ github.event.inputs.artifact == 'aab' || github.event.inputs.artifact == 'both' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon

      - name: Verify AAB is not debug-signed
        if: ${{ github.event.inputs.artifact == 'aab' || github.event.inputs.artifact == 'both' }}
        run: |
          AAB_FILE=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)
          jarsigner -verify -certs -verbose "$AAB_FILE" > aab-signature-report.txt
          if grep -q "CN=Android Debug" aab-signature-report.txt; then
            echo "AAB is debug signed. Refusing to upload artifact."
            cat aab-signature-report.txt
            exit 1
          fi
          echo "AAB release signature verified."

      - name: Verify APK is not debug-signed
        if: ${{ github.event.inputs.artifact == 'apk' || github.event.inputs.artifact == 'both' }}
        run: |
          APK_FILE=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          jarsigner -verify -certs -verbose "$APK_FILE" > apk-signature-report.txt
          if grep -q "CN=Android Debug" apk-signature-report.txt; then
            echo "APK is debug signed. Refusing to upload artifact."
            cat apk-signature-report.txt
            exit 1
          fi
          echo "APK release signature verified."

      - name: Upload signed APK artifact
        if: ${{ github.event.inputs.artifact == 'apk' || github.event.inputs.artifact == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: finsight-release-signed-apk-local
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signed Play Store AAB artifact
        if: ${{ github.event.inputs.artifact == 'aab' || github.event.inputs.artifact == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: finsight-playstore-release-signed-aab-local
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
