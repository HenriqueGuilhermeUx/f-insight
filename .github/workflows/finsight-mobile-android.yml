name: F-Insight Mobile Android Build

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "Which Android artifact to build"
        required: true
        default: "aab"
        type: choice
        options:
          - aab
          - apk
          - both

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: production
  EXPO_PUBLIC_API_URL: https://f-insight-api.onrender.com
  EXPO_PUBLIC_WEB_URL: https://f-insight.netlify.app

jobs:
  android-build:
    name: Build signed Android artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Check Expo token
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN is required. Add it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build signed Play Store AAB with EAS
        if: ${{ github.event.inputs.artifact == 'aab' || github.event.inputs.artifact == 'both' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > eas-aab-build.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('eas-aab-build.json', 'utf8').trim();
          const parsed = JSON.parse(raw);
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url = build?.artifacts?.buildUrl || build?.artifactUrl || build?.artifacts?.applicationArchiveUrl;
          if (!url) {
            console.error('Could not find EAS AAB artifact URL in build output.');
            console.error(raw);
            process.exit(1);
          }
          fs.writeFileSync('eas-aab-url.txt', url);
          NODE
          curl -L "$(cat eas-aab-url.txt)" -o finsight-playstore-release-signed.aab

      - name: Build signed internal APK with EAS
        if: ${{ github.event.inputs.artifact == 'apk' || github.event.inputs.artifact == 'both' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > eas-apk-build.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('eas-apk-build.json', 'utf8').trim();
          const parsed = JSON.parse(raw);
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url = build?.artifacts?.buildUrl || build?.artifactUrl || build?.artifacts?.applicationArchiveUrl;
          if (!url) {
            console.error('Could not find EAS APK artifact URL in build output.');
            console.error(raw);
            process.exit(1);
          }
          fs.writeFileSync('eas-apk-url.txt', url);
          NODE
          curl -L "$(cat eas-apk-url.txt)" -o finsight-internal-test-signed.apk

      - name: Upload signed Play Store AAB artifact
        if: ${{ github.event.inputs.artifact == 'aab' || github.event.inputs.artifact == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: finsight-playstore-release-signed-aab
          path: mobile/finsight-playstore-release-signed.aab
          if-no-files-found: error

      - name: Upload signed APK artifact
        if: ${{ github.event.inputs.artifact == 'apk' || github.event.inputs.artifact == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: finsight-internal-test-signed-apk
          path: mobile/finsight-internal-test-signed.apk
          if-no-files-found: error
