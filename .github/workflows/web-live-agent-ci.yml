name: Web Live Agent CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm 9
        run: |
          corepack enable
          corepack prepare pnpm@9.15.5 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript and production build
        env:
          VITE_API_URL: https://f-insight-api.onrender.com
        run: |
          pnpm exec tsc -b
          pnpm exec vite build

      - name: Backend public health and agent smoke test
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 4 --fail --silent --show-error https://f-insight-api.onrender.com/health | grep -q '"status":"ok"'
          curl --retry 5 --retry-delay 4 --fail --silent --show-error https://f-insight-api.onrender.com/api/agent/health | grep -q 'finsight-agent'
          curl --retry 5 --retry-delay 4 --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"objective":"Montar reserva","income":5000,"expenses":3800,"savings":300,"debt":0,"targetAmount":50000,"years":5}' \
            https://f-insight-api.onrender.com/api/agent/life-plan | grep -q 'life-plan-analysis'
