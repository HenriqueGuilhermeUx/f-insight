name: Web Auth Hardening CI

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.5 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript and production build
        env:
          VITE_API_URL: https://f-insight-api.onrender.com
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
        run: |
          pnpm exec tsc -b
          pnpm exec vite build

      - name: Authorization source guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'normalizeRole\([^)]*user_metadata|user_metadata\?\.role|user_metadata\.role' src/context/AuthContext.tsx; then
            echo 'User-editable metadata must not be used for authorization roles.'
            exit 1
          fi
          grep -q 'app_metadata' src/context/AuthContext.tsx
          grep -q 'VITE_SUPABASE_PUBLISHABLE_KEY' src/lib/supabase.ts
          ! grep -q 'dgtpfvjnuroxgamghicd' src/lib/supabase.ts

      - name: Production session consistency guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'confirmationRequired' src/context/AuthContext.tsx
          grep -q 'confirmationRequired' src/pages/Login.tsx
          grep -q 'localStorage.removeItem(ACCOUNTS_KEY)' src/context/AuthContext.tsx
          grep -q 'if (isSupabaseConfigured && supabase)' src/context/AuthContext.tsx
          grep -q 'Login não criou uma sessão válida' src/context/AuthContext.tsx
          grep -q 'Conta criada. Enviamos um e-mail de confirmação' src/pages/Login.tsx
          grep -q "VITE_ENABLE_DEMO_ACCESS === 'true'" src/context/AuthContext.tsx
          if grep -n 'REVIEWER_EMAIL\|reviewerUser\|local-google-reviewer\|password.length >= 6' src/context/AuthContext.tsx; then
            echo 'Production must not contain a local Play reviewer authentication bypass.'
            exit 1
          fi
          if grep -n 'isLocalBypassUser' src/context/AuthContext.tsx; then
            echo 'Configured production auth must not preserve local bypass users.'
            exit 1
          fi
          if grep -n 'Tenta o fallback local de cliente abaixo\|Cadastro local de cliente continua disponível como contingência' src/context/AuthContext.tsx; then
            echo 'Configured production auth must fail closed instead of using local credentials.'
            exit 1
          fi

      - name: Authenticated owner API compatibility guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q "authenticated-owner-only" src/services/userPreferencesApi.ts
          grep -q "/api/watchlist/me" src/services/userPreferencesApi.ts
          grep -q "/api/alerts/me" src/services/userPreferencesApi.ts
          grep -q "Authorization" src/services/userPreferencesApi.ts

      - name: Live-data integrity guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'Fallback mock data|publishedAt: new Date\(Date\.now|const (BRAZILIAN_STOCKS|US_STOCKS|CRYPTO_ASSETS|INDICES|NEWS|GRAHAM_PICKS)' src/services/marketData.ts; then
            echo 'Production market service must not silently substitute fabricated live-looking values.'
            exit 1
          fi
          grep -q 'production returns no picks instead of scores fabricated in the browser' src/services/marketData.ts
